services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: techstore-production-secret
      PORT: 4000
    volumes:
      - ./backend/public/images:/app/public/images
      - api_data:/app/prisma/data
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
